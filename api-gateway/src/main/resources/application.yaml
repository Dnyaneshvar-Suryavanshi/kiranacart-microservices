server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/catalog/**
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka